appId: swmansion.enriched.example
---
# addLink takes the zero-width-space-free indexes that onChangeSelection
# reports, so a link created after an empty list item (backed by a ZWS) lands
# exactly at the caret.
- launchApp

- tapOn:
    id: "toggle-screen-button"

- runFlow:
    file: "../subflows/set_editor_value.yaml"
    env:
      VALUE: '<html><ul><li></li></ul><p>Hi</p></html>'

- tapOn:
    id: "editor-input"
    point: "95%, 90%"

- scrollUntilVisible:
    element:
      id: "selection-output"
    direction: DOWN

- assertVisible:
    id: "selection-output"
    text: "3:3"

- scrollUntilVisible:
    element:
      id: "editor-input"
    direction: UP

- runFlow:
    file: "../subflows/insert_link.yaml"
    env:
      LINK_TEXT: "test"
      LINK_URL: "https://swmansion.com"

- tapOn:
    id: "blur-button"

- scrollUntilVisible:
    element:
      id: "html-output"
    direction: DOWN

# Maestro matches text as a regex; only the paragraph after the list matters.
- assertVisible:
    id: "html-output"
    text: '.*<p>Hi<a href="https://swmansion.com">test</a></p></html>'
